<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brainstorm WSB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: biblioteka — boczna nawigacja + kolumna do czytania + przyklejony spis treści; na telefonie dolny pasek zakładek. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --sunken:#eaeef3; --ink:#141c27; --muted:#5a6676; --faint:#8a95a3; --line:#dfe4ea;
  --accent:#2347c5; --accent-ink:#ffffff; --accent-soft:#e7ecfb;
  --term:#a35f00; --term-soft:#fbf1df;
  --ok:#13804a; --ok-soft:#e1f3e8; --bad:#c23a1a; --bad-soft:#fbe7e1;
  --c-key:#2347c5; --c-ex:#13804a; --c-warn:#b45309;
  --chart-a:#2347c5; --chart-b:#d9730d; --chart-c:#8a95a3; --chart-hi:#c23a1a; --chart-lo:#0e8a9a;
  --shadow:0 1px 2px rgba(20,28,39,.06),0 8px 24px rgba(20,28,39,.06);
  --font-display:"Unbounded","Segoe UI",system-ui,sans-serif;
  --font-body:"Onest",-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:14px; --side:264px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1319; --surface:#161d26; --sunken:#1d2530; --ink:#e8edf3; --muted:#9aa6b4; --faint:#6f7b89; --line:#28313d;
  --accent:#86a0ff; --accent-ink:#0e1319; --accent-soft:#1d2846;
  --term:#f0b35a; --term-soft:#2d2414;
  --ok:#4cc78a; --ok-soft:#14301f; --bad:#ff8a6b; --bad-soft:#3a1d16;
  --c-key:#86a0ff; --c-ex:#4cc78a; --c-warn:#f0b35a;
  --chart-a:#86a0ff; --chart-b:#f39a4a; --chart-c:#6f7b89; --chart-hi:#ff8a6b; --chart-lo:#4fc6d4;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1319; --surface:#161d26; --sunken:#1d2530; --ink:#e8edf3; --muted:#9aa6b4; --faint:#6f7b89; --line:#28313d;
  --accent:#86a0ff; --accent-ink:#0e1319; --accent-soft:#1d2846;
  --term:#f0b35a; --term-soft:#2d2414;
  --ok:#4cc78a; --ok-soft:#14301f; --bad:#ff8a6b; --bad-soft:#3a1d16;
  --c-key:#86a0ff; --c-ex:#4cc78a; --c-warn:#f0b35a;
  --chart-a:#86a0ff; --chart-b:#f39a4a; --chart-c:#6f7b89; --chart-hi:#ff8a6b; --chart-lo:#4fc6d4;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--font-body);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance;margin:0}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- szkielet ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);padding:20px 14px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand b{font:600 19px/1 var(--font-display);letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px}
.searchbtn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:10px;background:var(--sunken);color:var(--muted);font-size:14px;text-align:left}
.searchbtn kbd{margin-left:auto;font:500 11px var(--font-mono);border:1px solid var(--line);border-radius:5px;padding:1px 5px;background:var(--surface)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;color:var(--muted);font-weight:500;font-size:15px}
.nav a:hover{background:var(--sunken);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.navsub{display:flex;flex-direction:column;margin:2px 0 6px 21px;padding-left:12px;border-left:1px solid var(--line)}
.navsub a{font-size:13.5px;padding:6px 10px;gap:8px}
.navsub a .num{font:500 11px var(--font-mono);color:var(--faint);min-width:22px}
.navsub a.on .num{color:var(--accent)}
.navsub .dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--ok)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.seg{display:inline-flex;background:var(--sunken);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.topbar{display:none}
.main{min-width:0;padding:32px 40px 96px}
.tabbar{display:none}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding:10px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .topbar .brand{padding:0;flex:1}
  .topbar .logo{width:30px;height:30px;border-radius:9px}
  .iconbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
  .main{padding:20px 16px calc(96px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--faint);padding:4px 0}
  .tabbar a.on{color:var(--accent)}
  .tabbar svg.i{width:23px;height:23px}
}

/* ---------- typografia stron ---------- */
.page{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13.5px;color:var(--muted)}
.crumbs a:hover{color:var(--accent)}
.crumbs svg{width:14px;height:14px}
.eyebrow{font:600 12px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.h1{font:600 clamp(26px,4vw,38px)/1.15 var(--font-display);letter-spacing:-.02em}
.h2{font:600 20px/1.25 var(--font-display);letter-spacing:-.01em}
.lead{font-size:18px;color:var(--muted);max-width:62ch;margin:0}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:11px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--sunken);color:var(--ink)}
.btn.wide{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:500}
.chip:hover{border-color:var(--term);color:var(--term)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunken);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill svg{width:13px;height:13px;stroke-width:2.4}

/* ---------- start ---------- */
.hero{display:flex;flex-direction:column;gap:16px;padding:32px;border-radius:20px;background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,var(--accent-soft),transparent 70%);pointer-events:none}
.bigsearch{display:flex;align-items:center;gap:12px;max-width:560px;padding:14px 16px;border-radius:14px;background:var(--bg);border:1px solid var(--line);color:var(--muted);font-size:16px;text-align:left;position:relative;z-index:1}
.bigsearch:hover{border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.stat b{font:600 26px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.continue{display:flex;align-items:center;gap:16px;padding:18px 20px}
.continue:hover{border-color:var(--accent)}
.continue .body{flex:1;min-width:0}
.continue .body b{display:block;font-size:17px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.lcard{display:flex;flex-direction:column;gap:12px;padding:20px}
.lcard:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.lnum{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font:600 16px var(--font-display);background:var(--accent);color:var(--accent-ink)}
.lcard.soon{opacity:.6}
.lcard.soon .lnum{background:var(--sunken);color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--sunken);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:3px}
.soonlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.soonlist div{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px dashed var(--line);color:var(--muted);font-size:14px}
.soonlist .n{font:500 12px var(--font-mono);color:var(--faint)}

/* ---------- wykład ---------- */
.subgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.sub{display:flex;gap:14px;padding:16px 18px;align-items:flex-start}
.sub:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.sub .num{font:600 13px var(--font-mono);color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:5px 7px;flex:none}
.sub .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.sub .body b{font-size:16px;line-height:1.3}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.act{display:flex;gap:14px;align-items:center;padding:18px}
.act:hover{border-color:var(--accent)}
.act .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.act .ic.ok{background:var(--ok-soft);color:var(--ok)}
.act .body{flex:1;min-width:0}
.act .body b{display:block}

/* ---------- artykuł ---------- */
.artwrap{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:48px;max-width:1080px;margin:0 auto}
.art{min-width:0;max-width:70ch}
.toc{position:sticky;top:32px;align-self:start;display:flex;flex-direction:column;gap:2px;font-size:13.5px;border-left:1px solid var(--line);padding-left:14px}
.toc b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.toc a{color:var(--muted);padding:4px 0}
.toc a:hover,.toc a.on{color:var(--accent)}
@media (max-width:1200px){.artwrap{grid-template-columns:minmax(0,1fr)}.toc{display:none}}
.arthead{display:flex;flex-direction:column;gap:12px;margin-bottom:8px}
.meta{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.meta span{display:inline-flex;align-items:center;gap:6px}
.meta svg{width:16px;height:16px}
.prose{font-size:17px;line-height:1.72}
.prose>p{margin:0 0 16px}
.prose h2{font:600 22px/1.3 var(--font-display);letter-spacing:-.01em;margin:40px 0 14px;scroll-margin-top:80px}
.prose h3{font:600 17px/1.35 var(--font-body);margin:26px 0 8px}
.prose ul,.prose ol{margin:0 0 18px;padding-left:22px}
.prose li{margin:6px 0;padding-left:4px}
.prose li::marker{color:var(--accent);font-weight:600}
.prose strong{font-weight:650}
.term{display:inline;font:inherit;color:inherit;background:none;padding:0 1px;border-bottom:2px dotted var(--term);cursor:help;border-radius:2px;text-align:inherit}
.term:hover,.term[aria-expanded="true"]{background:var(--term-soft);color:var(--term)}
.call{margin:22px 0;padding:14px 18px 14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;gap:12px}
.call .ci{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
.call .ci svg{width:17px;height:17px;stroke-width:2}
.call.key .ci{background:var(--accent-soft);color:var(--c-key)}
.call.ex .ci{background:var(--ok-soft);color:var(--c-ex)}
.call.warn .ci{background:var(--term-soft);color:var(--c-warn)}
.call b.lab{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.call.key b.lab{color:var(--c-key)} .call.ex b.lab{color:var(--c-ex)} .call.warn b.lab{color:var(--c-warn)}
.call p{margin:0;font-size:16px;line-height:1.6}
.formula{margin:22px 0;padding:18px 20px;border-radius:12px;background:var(--sunken);text-align:center}
.formula .f{font:500 clamp(15px,2.4vw,19px)/1.5 var(--font-mono);overflow-x:auto;white-space:nowrap}
.formula figcaption{margin-top:6px;font-size:14px;color:var(--muted)}
.tbl{overflow-x:auto;margin:20px 0;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.45}
.tbl th,.tbl td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl th{font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunken)}
.chart{margin:24px 0;padding:18px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.chart h4{margin:0 0 4px;font-size:15px}
.chart .cap{margin:2px 0 12px;font-size:14px;color:var(--muted);line-height:1.5}
.chart svg.plot{width:100%;height:auto;display:block}
.chart svg.plot text{fill:var(--muted);font:12px var(--font-body)}
.chart svg.plot text.lab{fill:var(--ink);font-weight:600}
.ctrl{display:grid;gap:12px;margin-top:14px}
.ctrl label{display:grid;gap:4px;font-size:14px;font-weight:500}
.ctrl label span{display:flex;justify-content:space-between;color:var(--muted);font-weight:400}
input[type=range]{width:100%;accent-color:var(--accent)}
.verdict{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:15px;line-height:1.5;background:var(--sunken)}
.verdict b{display:block;margin-bottom:2px}
.verdict.ok{background:var(--ok-soft)} .verdict.ok b{color:var(--ok)}
.verdict.hi{background:var(--bad-soft)} .verdict.hi b{color:var(--bad)}
.verdict.lo{background:var(--accent-soft)} .verdict.lo b{color:var(--accent)}
 .steps{margin:14px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:10px;font-size:15px;line-height:1.55}
.steps li::marker{color:var(--accent);font-weight:700}
.scen{padding:14px 16px;border-radius:12px;background:var(--accent-soft);margin:12px 0}
.scen b{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.scen p{margin:4px 0 0}
.verdict.mid{background:var(--term-soft)} .verdict.mid b{color:var(--term)}
.solution{margin-top:14px;padding:14px 16px;border-radius:12px;border:1px solid var(--line);font-size:15px;line-height:1.55}
.solution ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.chart .seg button{font-size:12.5px;padding:6px 10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.endblock{margin-top:44px;display:flex;flex-direction:column;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.pn a{padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.pn a:hover{border-color:var(--accent)}
.pn a small{color:var(--muted);font-size:12.5px}
.pn a.next{text-align:right}

/* ---------- quiz ---------- */
.quiz{padding:22px}
.qtop{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:8px}
.qbar{height:4px;border-radius:2px;background:var(--sunken);overflow:hidden;margin-bottom:18px}
.qbar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qq{font-size:19px;font-weight:600;line-height:1.4;margin:0 0 16px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:16px;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--sunken);font:600 13px var(--font-mono);flex:none}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)} .opt.ok .k{background:var(--ok);color:var(--surface)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)} .opt.bad .k{background:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.why{margin:14px 0 0;padding:12px 14px;border-radius:10px;background:var(--sunken);font-size:15px}
.qres{text-align:center;padding:12px 0;display:flex;flex-direction:column;align-items:center;gap:6px}
.qres .big{font:600 48px/1 var(--font-display)}

/* ---------- fiszki ---------- */
.flash{min-height:260px;padding:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;cursor:pointer;user-select:none;border-radius:20px}
.flash .side-l{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.flash .w{font:600 clamp(22px,4vw,30px)/1.25 var(--font-display)}
.flash .d{font-size:18px;line-height:1.55;max-width:46ch}
.flash .hint{font-size:13px;color:var(--faint)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ---------- słownik ---------- */
.filter{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.filter input{flex:1;border:0;background:none;outline:none;font-size:16px;min-width:0}
.letter{font:600 15px var(--font-display);color:var(--accent);margin:10px 0 4px}
.glist{display:flex;flex-direction:column}
.gitem{display:flex;flex-direction:column;gap:2px;padding:12px 16px;border-bottom:1px solid var(--line)}
.gitem:last-child{border-bottom:0}
.gitem:hover{background:var(--sunken)}
.gitem b{font-size:16px}
.gitem span{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.termpage{max-width:70ch;display:flex;flex-direction:column;gap:18px}
.termpage .def{font-size:20px;line-height:1.55;margin:0}
.termpage .long{font-size:17px;line-height:1.72;margin:0}
.examline{font-size:14px;color:var(--muted)}
.examline b{color:var(--term)}

/* ---------- popup ---------- */
.pop{position:fixed;z-index:50;width:min(320px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:14px 16px;animation:pop .14s ease-out}
.pop::before{content:"";position:absolute;left:var(--ax,24px);width:12px;height:12px;background:var(--surface);border:1px solid var(--line);transform:rotate(45deg)}
.pop.below::before{top:-7px;border-right:0;border-bottom:0}
.pop.above::before{bottom:-7px;border-left:0;border-top:0}
.pop b{display:block;font-size:15.5px;margin-bottom:4px}
.pop p{margin:0;font-size:14.5px;line-height:1.5;color:var(--ink)}
.pop .examline{margin-top:6px}
.pop a{display:inline-flex;align-items:center;gap:4px;margin-top:10px;font-size:14px;font-weight:600;color:var(--accent)}
.pop a svg{width:15px;height:15px}
@keyframes pop{from{opacity:0;transform:translateY(4px)}}

/* ---------- wyszukiwarka ---------- */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(10,14,20,.45);display:flex;justify-content:center;align-items:flex-start;padding:calc(10vh + env(safe-area-inset-top,0px)) 16px 16px}
.spanel{width:min(640px,100%);max-height:75vh;display:flex;flex-direction:column;background:var(--surface);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
.sinput{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.sinput input{flex:1;border:0;outline:none;background:none;font-size:18px;min-width:0}
.sinput button{font-size:13px;color:var(--muted)}
.sres{overflow-y:auto;padding:8px}
.sgroup{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:10px 12px 4px}
.sitem{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:10px}
.sitem:hover,.sitem.sel{background:var(--accent-soft)}
.sitem .ic{color:var(--muted);margin-top:2px}
.sitem b{display:block;font-size:15px}
.sitem span{font-size:13.5px;color:var(--muted)}
.sempty{padding:24px;text-align:center;color:var(--muted)}

/* ---------- ustawienia, toast ---------- */
.setrow{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.setrow:last-child{border-bottom:0}
.setrow input[type=date]{padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg)}
.danger{color:var(--bad);font-weight:600}
.toast{position:fixed;left:50%;top:calc(20px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;display:flex;gap:10px;align-items:center;white-space:nowrap;animation:pop .2s}
@media (max-width:900px){
  .stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .stat{padding:12px}
  .stat b{font-size:21px}
  .hero{padding:22px}
  .acts{grid-template-columns:1fr}
  .pn{grid-template-columns:1fr}
  .pn a.next{text-align:left}
}

/* ===== Nieurodzaj: Polska (gra) — ciemny interfejs strategiczny ===== */

  get(k, d){ try{ const v = localStorage.getItem("makro2." + k); return v == null ? d : JSON.parse(v); }catch{ return d; } },

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---------- mini-markdown ----------
function inline(s){
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\[\[([a-z0-9-]+)(?:\|([^\]]+))?\]\]/g, (m, id, txt) => TERM[id]
      ? `<button type="button" class="term" data-t="${id}" aria-expanded="false">${txt || esc(tn(id).n)}</button>`
      : (txt || id));
}
function md(src){
  const lines = src.split("\n"); const out = []; const toc = []; let i = 0;
  const CALL = { zapamietaj:["key","bulb"], przyklad:["ex","pen"], uwaga:["warn","alert"] };
  while (i < lines.length){
    const ln = lines[i].trim();
    if (!ln){ i++; continue; }
    let m;
    if ((m = ln.match(/^## (.+)/))){ const id = "s" + (toc.length + 1); toc.push({ id, h: m[1] }); out.push(`<h2 id="${id}">${inline(m[1])}</h2>`); i++; continue; }
    if ((m = ln.match(/^### (.+)/))){ out.push(`<h3>${inline(m[1])}</h3>`); i++; continue; }
    if ((m = ln.match(/^\{\{chart:(\w+)\}\}$/))){ out.push(`<div class="chart" data-chart="${m[1]}"></div>`); i++; continue; }
    if ((m = ln.match(/^\$\$ (.+?)(?: \| (.+))?$/))){ out.push(`<figure class="formula"><div class="f">${esc(m[1])}</div>${m[2] ? `<figcaption>${inline(m[2])}</figcaption>` : ""}</figure>`); i++; continue; }
    if ((m = ln.match(/^> !(\w+) (.+)/))){
      const [cls, ic] = CALL[m[1]] || CALL.zapamietaj;
      out.push(`<aside class="call ${cls}"><span class="ci">${icon(ic)}</span><div><b class="lab">${t(UI[cls])}</b><p>${inline(m[2])}</p></div></aside>`); i++; continue;
    }
    if (ln.startsWith("|")){
      const rows = []; while (i < lines.length && lines[i].trim().startsWith("|")){ rows.push(lines[i].trim()); i++; }
      const cells = r => r.slice(1, -1).replace(/\[\[([^\]]*?)\|/g, "[[$1\u0001").split("|").map(c => c.replace(/\u0001/g, "|").trim());   // | wewnątrz [[id|tekst]] nie dzieli komórki
      const body = rows.filter(r => !/^\|[\s|:-]+\|$/.test(r));
      out.push(`<div class="tbl"><table><thead><tr>${cells(body[0]).map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${body.slice(1).map(r => `<tr>${cells(r).map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      continue;
    }
    if (/^(- |\d+\. )/.test(ln)){
      const ord = /^\d/.test(ln); const items = [];
      while (i < lines.length && /^(- |\d+\. )/.test(lines[i].trim())){ items.push(lines[i].trim().replace(/^(- |\d+\. )/, "")); i++; }
      out.push(`<${ord ? "ol" : "ul"}>${items.map(x => `<li>${inline(x)}</li>`).join("")}</${ord ? "ol" : "ul"}>`); continue;
    }
    out.push(`<p>${inline(ln)}</p>`); i++;
  }
  return { html: out.join(""), toc };
}

  const h = location.hash.replace(/^#/, "");
  let m;
  if (!h || h === "start") return { v: "home" };
  if ((m = h.match(/^w(\d+)$/))) return { v: "lecture", n: +m[1] };
  if ((m = h.match(/^w(\d+)-fiszki$/))) return { v: "cards", n: +m[1] };
  if ((m = h.match(/^w(\d+)-test$/))) return { v: "final", n: +m[1] };
  if ((m = h.match(/^w(\d+\.\d+)$/))) return { v: "sub", id: m[1] };
  if (h === "slownik") return { v: "glossary" };
  if ((m = h.match(/^p-([a-z0-9-]+)$/))) return { v: "term", id: m[1] };
  if (h === "dev-gra") return { v: "game" };
  if (h === "egzamin") return { v: "exam" };
  if (h === "ustawienia") return { v: "settings" };
  return { v: "home" };
}

function quiz(el, qs, onFinish){
  let i = 0, score = 0;
  const K = "ABCDE";
  const draw = () => {
    if (i >= qs.length){
      const pct = Math.round(score / qs.length * 100);
      onFinish?.(score / qs.length);
      el.innerHTML = `<div class="qres"><span style="color:${pct === 100 ? "var(--ok)" : "var(--term)"}">${icon(pct === 100 ? "trophy" : "target")}</span>
        <div class="big">${pct}%</div><div class="muted">${score} / ${qs.length}</div>
        <p style="max-width:44ch">${pct === 100 ? t(UI.perfect) : t(UI.need)}</p>
        <button class="btn ghost" id="re">${t(UI.retry)}</button></div>`;
      el.querySelector("#re").onclick = () => quiz(el, qs, onFinish);
      return;
    }
    const q = qs[i];
    el.innerHTML = `<div class="qtop"><span>${t(UI.q)} ${i + 1} / ${qs.length}</span><span>${score} ${icon("check")}</span></div>
      <div class="qbar"><i style="width:${i / qs.length * 100}%"></i></div>
      <p class="qq">${esc(t(q.q))}</p>
      <div class="opts">${q.a.map((a, k) => `<button class="opt" data-k="${k}"><span class="k">${K[k]}</span><span>${esc(t(a))}</span></button>`).join("")}</div>
      <div id="fb"></div>`;
    el.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const k = +b.dataset.k, ok = k === q.correct; if (ok) score++;
      el.querySelectorAll(".opt").forEach(o => { o.disabled = true; if (+o.dataset.k === q.correct) o.classList.add("ok"); else if (o === b) o.classList.add("bad"); });
      el.querySelector("#fb").innerHTML = `<p class="why"><b>${ok ? t(UI.good) : t(UI.bad)}</b> ${esc(t(q.why))}</p>
        <div style="margin-top:14px"><button class="btn" id="nx">${i + 1 < qs.length ? t(UI.nextQ) : t(UI.finish)}${icon("arrow")}</button></div>`;
      el.querySelector("#nx").onclick = () => { i++; draw(); el.scrollIntoView({ block: "nearest" }); };
    });
  };
  draw();
}

const NS = (w, h, inner) => `<svg class="plot" viewBox="0 0 ${w} ${h}" role="img">${inner}</svg>`;
const line = (x1, y1, x2, y2, c, w = 2.5, da = "") => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${da ? `stroke-dasharray="${da}"` : ""}/>`;
// odcinek przycięty do prostokąta (Liang–Barsky); clipPath bywa ignorowany w podglądzie
function seg(x1, y1, x2, y2, [bx0, by0, bx1, by1], c, w = 2.5, da = ""){
  let t0 = 0, t1 = 1; const dx = x2 - x1, dy = y2 - y1;
  for (const [p, q] of [[-dx, x1 - bx0], [dx, bx1 - x1], [-dy, y1 - by0], [dy, by1 - y1]]){
    if (p === 0){ if (q < 0) return ""; continue; }
    const r = q / p; if (p < 0){ if (r > t1) return ""; if (r > t0) t0 = r; } else { if (r < t0) return ""; if (r < t1) t1 = r; }
  }
  return line(x1 + t0 * dx, y1 + t0 * dy, x1 + t1 * dx, y1 + t1 * dy, c, w, da);
}
const txt = (x, y, s, cls = "", anchor = "start") => `<text x="${x}" y="${y}" class="${cls}" text-anchor="${anchor}">${s}</text>`;
const head = (k) => `<h4>${t(UI[k + "_t"])}</h4><p class="cap">${t(UI[k + "_c"])}</p>`;

const CHARTS = {
  ds(el){
    const Lg = (pl, ru) => lang === "pl" ? pl : ru;
    const k = v => num(Math.round(v * 100) / 100);           // liczba z przecinkiem
    const W = 440, H = 310, L = 46, B = 270, R = 430, T = 14, QM = 14, PM = 11;
    const X = q => L + q / QM * (R - L), Y = p => B - p / PM * (B - T), box = [L, T, R, B];
    const grid = () => {
      let g = "";

// ---------- popup pojęcia ----------
let popEl = null, popAnchor = null, popY = 0;
function closePop(){
  if (!popEl) return;
  popEl.remove(); popEl = null;
  popAnchor?.setAttribute("aria-expanded", "false"); popAnchor = null;
}
function openPop(anchor){
  const id = anchor.dataset.t, g = TERM[id]; if (!g) return;
  if (popAnchor === anchor){ closePop(); return; }
  closePop();
  const d = g[lang];
  popEl = document.createElement("div");
  popEl.className = "pop"; popEl.setAttribute("role", "dialog"); popEl.setAttribute("aria-label", d.n);
  popEl.innerHTML = `<b>${esc(d.n)}</b><p>${esc(d.s)}</p>${lang === "ru" ? `<div class="examline">${t(UI.onExam)}: <b>${esc(g.pl.n)}</b></div>` : ""}<a href="#p-${id}">${t(UI.more)}${icon("arrow")}</a>`;
  document.body.appendChild(popEl);
  popAnchor = anchor; anchor.setAttribute("aria-expanded", "true");
  const r = anchor.getClientRects()[0] || anchor.getBoundingClientRect();
  const pw = popEl.offsetWidth, ph = popEl.offsetHeight, vw = innerWidth, vh = innerHeight;
  let left = Math.min(Math.max(12, r.left + r.width / 2 - pw / 2), vw - pw - 12);
  const below = r.bottom + ph + 14 < vh || r.top < ph + 14;
  popEl.classList.add(below ? "below" : "above");
  popEl.style.left = left + "px";
  popEl.style.top = (below ? r.bottom + 10 : r.top - ph - 10) + "px";
  popEl.style.setProperty("--ax", Math.min(pw - 24, Math.max(12, r.left + r.width / 2 - left - 6)) + "px");
  popY = scrollY;
}
document.addEventListener("click", e => {
  const tr = e.target.closest(".term, .term-chip");
  if (tr){ e.preventDefault(); TRACK.ev("term", tr.dataset.t, 0); openPop(tr); return; }
  if (popEl && !popEl.contains(e.target)) closePop();
});
addEventListener("scroll", () => { if (popEl && Math.abs(scrollY - popY) > 6) closePop(); }, { passive: true });
document.addEventListener("scroll", e => { if (popEl && e.target !== document) closePop(); }, { passive: true, capture: true });
addEventListener("resize", closePop);

// ---------- wyszukiwarka ----------
const norm = s => s.toLowerCase().replace(/ł/g, "l").normalize("NFD").replace(/[̀-ͯ]/g, "");
function searchIndex(){
  const items = [];
  GL.forEach(g => items.push({ kind: "t", href: "#p-" + g.id, title: g[lang].n, sub: g[lang].s, hay: norm(g[lang].n + " " + g[lang].s + " " + g.pl.n) }));
  allSubs.forEach(s => {
    const heads = [...t(s.body).matchAll(/^## (.+)$/gm)].map(m => m[1]);
    items.push({ kind: "s", href: "#w" + s.id, title: s.id + " · " + t(s.title), sub: heads.join(" · "), hay: norm(t(s.title) + " " + heads.join(" ") + " " + t(s.body).replace(/\[\[[^|\]]+\|?([^\]]*)\]\]/g, "$1")) });
  });
  return items;
}
function openSearch(){
  closePop();
  if (document.querySelector(".overlay")) return;
  const ov = document.createElement("div"); ov.className = "overlay";
  ov.innerHTML = `<div class="spanel" role="dialog" aria-label="${t(UI.searchShort)}">
    <div class="sinput">${icon("search")}<input id="sq" placeholder="${t(UI.search)}" autocomplete="off"><button id="sx">${t(UI.close)}</button></div>
    <div class="sres" id="sr"></div></div>`;
  document.body.appendChild(ov);
  const idx = searchIndex(), inp = ov.querySelector("#sq"), res = ov.querySelector("#sr");
  const close = () => ov.remove();
  const draw = () => {
    const q = norm(inp.value.trim());
    if (!q){ res.innerHTML = `<div class="sgroup">${t(UI.gTopics)}</div>` + idx.filter(x => x.kind === "s").map(item).join(""); return; }
    const words = q.split(/\s+/);
    const scored = idx.map(x => {
      if (!words.every(w => x.hay.includes(w))) return null;
      const tt = norm(x.title); let sc = 0;
      words.forEach(w => { if (tt.startsWith(w)) sc += 10; else if (tt.includes(w)) sc += 5; });
      return { x, sc: sc + (x.kind === "t" ? 1 : 0) };
    }).filter(Boolean).sort((a, b) => b.sc - a.sc);
    const T = scored.filter(s => s.x.kind === "t").slice(0, 8), Su = scored.filter(s => s.x.kind === "s").slice(0, 6);
    res.innerHTML = !T.length && !Su.length ? `<div class="sempty">${t(UI.noRes)}</div>`
      : (T.length ? `<div class="sgroup">${t(UI.gTerms)}</div>${T.map(s => item(s.x)).join("")}` : "") + (Su.length ? `<div class="sgroup">${t(UI.gTopics)}</div>${Su.map(s => item(s.x)).join("")}` : "");
    res.querySelector(".sitem")?.classList.add("sel");
  };
  const item = x => `<a class="sitem" href="${x.href}"><span class="ic">${icon(x.kind === "t" ? "tag" : "book")}</span><span><b>${esc(x.title)}</b><span>${esc(x.sub)}</span></span></a>`;
  let st; inp.oninput = () => { draw(); clearTimeout(st); st = setTimeout(() => { const v = inp.value.trim(); if (v.length > 2) TRACK.ev("search", v.toLowerCase(), 0); }, 1500); }; draw(); inp.focus();
  ov.onclick = e => { if (e.target === ov || e.target.closest("#sx") || e.target.closest(".sitem")) close(); };
  inp.onkeydown = e => {
    const all = [...res.querySelectorAll(".sitem")], cur = all.findIndex(a => a.classList.contains("sel"));
    if (e.key === "Escape") close();
    else if (e.key === "Enter" && all[cur]){ location.hash = all[cur].getAttribute("href"); close(); }
    else if (e.key === "ArrowDown" || e.key === "ArrowUp"){
      e.preventDefault(); all[cur]?.classList.remove("sel");
      const n = all[(cur + (e.key === "ArrowDown" ? 1 : all.length - 1)) % all.length]; n?.classList.add("sel"); n?.scrollIntoView({ block: "nearest" });
    }
  };
}
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); openSearch(); }
  else if (e.key === "/" && !/input|textarea/i.test(document.activeElement.tagName)){ e.preventDefault(); openSearch(); }
  else if (e.key === "Escape") closePop();
});
document.addEventListener("click", e => {
  if (e.target.closest("[data-open-search]")) openSearch();
  const lb = e.target.closest("[data-lang]"); if (lb){ lang = lb.dataset.lang; store.set("lang", lang); render(false); }
});

// ---------- anonimowa statystyka (tylko na własnym hostingu z /api/t) ----------
const TRACK = (() => {
  const on = /^https?:$/.test(location.protocol) && !/claude\.ai|claudeusercontent/.test(location.hostname);
  let vid = store.get("vid", null); if (!vid){ vid = (crypto.randomUUID?.() || String(Math.random()).slice(2)); store.set("vid", vid); }
  const q = []; let page = "start", active = 0, lastMove = Date.now(), lastTick = Date.now();
  const flush = () => {
    if (!on || !q.length) return;
    const body = JSON.stringify({ v: vid, lang, d: matchMedia("(max-width:900px)").matches ? "m" : "d", e: q.splice(0) });
    try { navigator.sendBeacon?.("/api/t", new Blob([body], { type: "application/json" })) || fetch("/api/t", { method: "POST", body, keepalive: true }).catch(() => {}); } catch {}
  };
  const tick = () => {
    const now = Date.now();
    if (document.visibilityState === "visible" && now - lastMove < 60000) active += now - lastTick;
    lastTick = now;
  };
  const pushTime = () => { tick(); if (active >= 1000){ q.push(["time", page, Math.round(active / 1000)]); active = 0; } };
  ["pointerdown", "keydown", "scroll", "touchstart"].forEach(ev => addEventListener(ev, () => { tick(); lastMove = Date.now(); }, { passive: true }));
  setInterval(() => { pushTime(); flush(); }, 30000);
  document.addEventListener("visibilitychange", () => { pushTime(); if (document.visibilityState === "hidden") flush(); else lastTick = Date.now(); });
  addEventListener("pagehide", () => { pushTime(); flush(); });
  return {
    view(p){ pushTime(); page = p; q.push(["view", p, 0]); },
    ev(type, p, val){ q.push([type, String(p).slice(0, 80), val | 0]); },
  };
})();

// ---------- render ----------
let tocObs = null, endObs = null;
function render(scrollTop = true){
  closePop(); tocObs?.disconnect(); endObs?.disconnect();
  TRACK.view(location.hash.replace(/^#/, "") || "start");
  document.documentElement.lang = lang;
  const r = route(), main = document.getElementById("main");
  const L = r.n ? C.lectures.find(x => x.n === r.n) : null;
  const s = r.v === "sub" ? findSub(r.id) : null, g = r.v === "term" ? TERM[r.id] : null;
  renderChrome(r);
  main.innerHTML =
    r.v === "lecture" && L ? vLecture(L) :
    r.v === "cards" && L ? vCards(L) :
    r.v === "final" && L ? vFinal(L) :
    s ? vSub(s) :
    r.v === "glossary" ? vGlossary() :
    g ? vTerm(g) :
    r.v === "game" ? `<div class="page" id="gamebox"></div>` :
    r.v === "exam" ? vExam() :
    r.v === "settings" ? vSettings() : vHome();
  document.title = (s ? t(s.title) : g ? g[lang].n : L ? `${t(UI.lecture)} ${L.n}` : "") ? `${s ? t(s.title) : g ? g[lang].n : `${t(UI.lecture)} ${L.n}`} · Brainstorm WSB` : "Brainstorm WSB";

  main.querySelectorAll("[data-chart]").forEach(el => CHARTS[el.dataset.chart]?.(el));
  if (s){
    S.last = s.id; save();
    quiz(main.querySelector("#quiz"), s.quiz, r => { TRACK.ev("mini", s.id, Math.round(r * 100)); if (S.mini[s.id] == null || r > S.mini[s.id]){ S.mini[s.id] = r; save(); renderChrome(route()); } });
    main.querySelectorAll("[data-goto]").forEach(a => a.onclick = e => { e.preventDefault(); document.getElementById(a.dataset.goto)?.scrollIntoView({ behavior: "smooth" }); });
    const tocLinks = [...main.querySelectorAll(".toc a")];
    tocObs = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting){ tocLinks.forEach(a => a.classList.toggle("on", a.dataset.goto === en.target.id)); } }), { rootMargin: "0px 0px -70% 0px" });
    main.querySelectorAll(".prose h2").forEach(h => tocObs.observe(h));
    endObs = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting) && !S.read[s.id]){ S.read[s.id] = true; save(); renderChrome(route()); } });
    endObs.observe(main.querySelector("#endmark"));
  }
  if (L && r.v === "cards") cards(main.querySelector("#cards"), lecTerms(L));
  if (L && r.v === "final") quiz(main.querySelector("#quiz"), L.final, res => {
    const k = "w" + L.n, was = lecPassed(L);
    if (S.best[k] == null || res > S.best[k]){ S.best[k] = res; save(); }
    TRACK.ev("final", "w" + L.n, Math.round(res * 100));
    if (res === 1 && !was) toast(`${icon("trophy")}${t(UI.passedToast)}`);
  });
  if (r.v === "glossary"){
    const f = main.querySelector("#gfilter"), gl = main.querySelector("#glist");
    gl.innerHTML = glossaryList(""); f.oninput = () => gl.innerHTML = glossaryList(f.value);
  }
  if (r.v !== "game") { document.body.classList.remove("gaming"); document.querySelector(".gfull")?.remove(); }
  if (r.v === "game") window.BrainstormGame?.mount(main.querySelector("#gamebox"), { lang, inline, esc, track: (a, b, c) => TRACK.ev(a, b, c) });
  if (r.v === "exam") main.querySelector("#go").onclick = () => {
    const pool = C.lectures.flatMap(x => [...x.final, ...x.subs.flatMap(s => s.quiz)]);
    const seen = new Set(); const qs = pool.sort(() => Math.random() - .5).filter(q => !seen.has(q.q.pl) && seen.add(q.q.pl)).slice(0, 15);
    quiz(main.querySelector("#quiz"), qs);
  };
  if (r.v === "settings"){
    main.querySelectorAll("[data-theme]").forEach(b => b.onclick = () => { store.set("theme", b.dataset.theme); applyTheme(); render(false); });
    main.querySelector("#examdate").onchange = e => { if (e.target.value) store.set("exam", e.target.value); };
    const rb = main.querySelector("#reset"); let armed = false;
    rb.onclick = () => {
      if (!armed){ armed = true; rb.textContent = t(UI.resetSure); return; }
      S.read = {}; S.mini = {}; S.best = {}; S.last = null; save(); toast(t(UI.resetDone)); render(false);
    };
  }
  if (scrollTop) scrollTo(0, 0);
}
addEventListener("hashchange", () => render(true));
applyTheme();
render(false);
</script>
