<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Makroekonomia WSB</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--text:#1d1d1f;--muted:#6b6b70;--line:#e3e1db;--accent:#1f5eff;--accent-soft:#e7eeff;--ok:#1a8f4c;--bad:#c9372c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--card:#1c1c1f;--text:#ececef;--muted:#9a9aa2;--line:#2c2c31;--accent:#6c95ff;--accent-soft:#1f2740;--ok:#3cc47a;--bad:#ff6b5e}}
:root[data-theme="dark"]{--bg:#121214;--card:#1c1c1f;--text:#ececef;--muted:#9a9aa2;--line:#2c2c31;--accent:#6c95ff;--accent-soft:#1f2740;--ok:#3cc47a;--bad:#ff6b5e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0;flex:1}
header small{color:var(--muted);font-weight:400}
button{font:inherit;color:inherit;cursor:pointer}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px}
a.pill{color:inherit}
.pill.on,a.pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
.layout{display:grid;grid-template-columns:260px 1fr;max-width:1100px;margin:0 auto}
nav{padding:16px;border-right:1px solid var(--line);min-height:calc(100vh - 57px)}
nav a{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;color:inherit;text-decoration:none;margin-bottom:2px}
nav a:hover{background:var(--accent-soft)}
nav a.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav .wk{font-size:12px;color:var(--muted);min-width:38px}
nav .done{margin-left:auto;color:var(--ok)}
main{padding:24px 16px 64px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.card h2,.card h3{margin-top:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat b{display:block;font-size:28px}
.stat span{color:var(--muted);font-size:14px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
ul.sum li{margin-bottom:6px}
.formula{font-family:ui-monospace,Menlo,monospace;background:var(--accent-soft);padding:10px 12px;border-radius:8px;margin:8px 0}
.formula small{display:block;font-family:system-ui;color:var(--muted)}
table{width:100%;border-collapse:collapse}
td,th{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500;font-size:14px}
.flash{min-height:180px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:22px;cursor:pointer;user-select:none}
.flash .side{color:var(--muted);font-size:13px;display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.opt{display:block;width:100%;text-align:left;padding:10px 12px;margin:6px 0;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.opt.ok{border-color:var(--ok);color:var(--ok)}
.opt.bad{border-color:var(--bad);color:var(--bad)}
.why{color:var(--muted);font-size:14px}
input[type=range]{width:100%}
svg text{fill:var(--muted);font-size:12px}
.menu-btn{display:none}
@media (max-width:760px){
  .layout{grid-template-columns:1fr}
  nav{display:none;border-right:0;border-bottom:1px solid var(--line);min-height:0}
  nav.open{display:block}
  .menu-btn{display:inline-block}
}
</style>
</head>
<body>
<header>
  <button class="pill menu-btn" onclick="document.querySelector('nav').classList.toggle('open')">☰</button>
  <h1 id="title"></h1>
  <button class="pill" id="langBtn"></button>
  <button class="pill" id="themeBtn">◐</button>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<script src="data.js"></script>
<script>
const C = window.COURSE;
const UI = {
  home:{pl:"Pulpit",ru:"Главная"}, topics:{pl:"Tematy",ru:"Темы"}, week:{pl:"Tydz.",ru:"Нед."},
  progress:{pl:"Postęp",ru:"Прогресс"}, toExam:{pl:"dni do egzaminu",ru:"дней до экзамена"},
  learned:{pl:"tematów opanowanych",ru:"тем изучено"}, start:{pl:"Kontynuuj naukę",ru:"Продолжить"},
  summary:{pl:"Notatki",ru:"Конспект"}, formulas:{pl:"Wzory",ru:"Формулы"}, terms:{pl:"Pojęcia",ru:"Термины"},
  cards:{pl:"Fiszki",ru:"Карточки"}, quiz:{pl:"Test",ru:"Тест"}, chart:{pl:"Wykres",ru:"График"},
  flip:{pl:"Kliknij, aby odwrócić",ru:"Нажми, чтобы перевернуть"}, know:{pl:"Umiem ✓",ru:"Знаю ✓"},
  again:{pl:"Jeszcze raz ↻",ru:"Ещё раз ↻"}, next:{pl:"Dalej →",ru:"Дальше →"},
  result:{pl:"Wynik",ru:"Результат"}, retry:{pl:"Spróbuj ponownie",ru:"Пройти снова"},
  mark:{pl:"Oznacz jako opanowany",ru:"Отметить как изученную"}, unmark:{pl:"Opanowany ✓",ru:"Изучено ✓"},
  exam:{pl:"Egzamin próbny",ru:"Пробный экзамен"}, examDesc:{pl:"Losowe pytania ze wszystkich tematów",ru:"Случайные вопросы по всем темам"},
  shift:{pl:"Przesunięcie AD (np. wzrost G)",ru:"Сдвиг AD (например, рост G)"},
  shiftS:{pl:"Przesunięcie SRAS (np. szok podażowy)",ru:"Сдвиг SRAS (например, шок предложения)"},
  demo:{pl:"Dane testowe: prawdziwe materiały zostaną dodane później.",ru:"Тестовые данные: настоящие материалы будут добавлены позже."},
};
const store = {
  get(k,d){try{return JSON.parse(localStorage.getItem("makro."+k))??d}catch{return d}},
  set(k,v){try{localStorage.setItem("makro."+k,JSON.stringify(v))}catch{}}
};
let lang = store.get("lang","pl");
let done = store.get("done",{});
const t = o => o==null ? "" : (typeof o==="string" ? o : (o[lang] ?? o.pl));
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function applyTheme(){const th=store.get("theme",null); if(th) document.documentElement.dataset.theme=th;}
document.getElementById("themeBtn").onclick=()=>{
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const n = dark?"light":"dark"; document.documentElement.dataset.theme=n; store.set("theme",n);
};
document.getElementById("langBtn").onclick=()=>{lang=lang==="pl"?"ru":"pl";store.set("lang",lang);render();};

function nav(){
  const cur = location.hash.slice(2)||"";
  document.getElementById("nav").innerHTML =
    `<a href="#/" class="${cur===""?"active":""}">🏠 ${t(UI.home)}</a>
     <a href="#/exam" class="${cur==="exam"?"active":""}">🎯 ${t(UI.exam)}</a>
     <p style="color:var(--muted);font-size:13px;margin:16px 10px 6px">${t(UI.topics)}</p>` +
    C.topics.map(x=>`<a href="#/${x.id}" class="${cur.startsWith(x.id)?"active":""}">
      <span class="wk">${t(UI.week)} ${x.week}</span>${esc(t(x.title))}${done[x.id]?'<span class="done">✓</span>':""}</a>`).join("");
}

function home(){
  const n=C.topics.length, d=C.topics.filter(x=>done[x.id]).length;
  const days=Math.max(0,Math.ceil((new Date(C.examDate)-new Date())/864e5));
  const nextT=C.topics.find(x=>!done[x.id])||C.topics[0];
  return `<div class="card" style="border-style:dashed;color:var(--muted)">ℹ️ ${t(UI.demo)}</div>
  <div class="stats">
    <div class="card stat"><b>${d}/${n}</b><span>${t(UI.learned)}</span></div>
    <div class="card stat"><b>${days}</b><span>${t(UI.toExam)}</span></div>
  </div>
  <div class="card"><h3>${t(UI.progress)}</h3><div class="bar"><i style="width:${n?d/n*100:0}%"></i></div>
    <p><a class="pill on" style="text-decoration:none;display:inline-block" href="#/${nextT.id}">${t(UI.start)}: ${esc(t(nextT.title))}</a></p></div>`;
}

const TABS=["summary","formulas","terms","cards","quiz"];
function topic(x, tab){
  const tabs=[...TABS]; if(x.chart) tabs.splice(2,0,"chart");
  if(!tabs.includes(tab)) tab="summary";
  let body="";
  if(tab==="summary") body=`<ul class="sum">${(x.summary[lang]||x.summary.pl).map(s=>`<li>${esc(s)}</li>`).join("")}</ul>`;
  if(tab==="formulas") body=x.formulas.map(f=>`<div class="formula">${esc(f.f)}<small>${esc(t(f.d))}</small></div>`).join("");
  if(tab==="terms") body=`<table><tr><th>PL</th><th>RU</th><th>EN</th></tr>${x.terms.map(r=>`<tr><td><b>${esc(r.pl)}</b></td><td>${esc(r.ru)}</td><td>${esc(r.en||"")}</td></tr>`).join("")}</table>`;
  if(tab==="chart") body=`<div id="chart"></div>`;
  if(tab==="cards") body=`<div id="cards"></div>`;
  if(tab==="quiz") body=`<div id="quiz"></div>`;
  return `<div class="card"><div class="row" style="justify-content:space-between">
      <h2 style="margin:0">${esc(t(x.title))}</h2>
      <button class="pill ${done[x.id]?"on":""}" id="markBtn">${t(done[x.id]?UI.unmark:UI.mark)}</button></div></div>
    <div class="tabs">${tabs.map(k=>`<a class="pill ${k===tab?"on":""}" style="text-decoration:none" href="#/${x.id}/${k}">${t(UI[k])}</a>`).join("")}</div>
    <div class="card">${body}</div>`;
}

function cards(el, x){
  let deck=x.terms.map((r,i)=>i), i=0, flipped=false;
  const draw=()=>{
    if(!deck.length){el.innerHTML=`<p style="text-align:center">🎉</p><p style="text-align:center"><button class="pill" id="re">${t(UI.retry)}</button></p>`;el.querySelector("#re").onclick=()=>cards(el,x);return;}
    const r=x.terms[deck[i%deck.length]];
    const front=r.pl, back=r.ru+(r.en?` · ${r.en}`:"");
    el.innerHTML=`<div class="flash" id="fc"><div><span class="side">${flipped?"RU / EN":"PL"} · ${deck.length} ⧗</span>${esc(flipped?back:front)}<span class="side">${t(UI.flip)}</span></div></div>
      <div class="row" style="justify-content:center"><button class="pill" id="ag">${t(UI.again)}</button><button class="pill on" id="kn">${t(UI.know)}</button></div>`;
    el.querySelector("#fc").onclick=()=>{flipped=!flipped;draw();};
    el.querySelector("#ag").onclick=()=>{i++;flipped=false;draw();};
    el.querySelector("#kn").onclick=()=>{deck.splice(i%deck.length,1);flipped=false;draw();};
  };
  draw();
}

function quiz(el, qs){
  let i=0, score=0;
  const draw=()=>{
    if(i>=qs.length){el.innerHTML=`<h3>${t(UI.result)}: ${score}/${qs.length}</h3><button class="pill" id="re">${t(UI.retry)}</button>`;el.querySelector("#re").onclick=()=>quiz(el,qs);return;}
    const q=qs[i];
    el.innerHTML=`<p style="color:var(--muted)">${i+1}/${qs.length}</p><h3>${esc(t(q.q))}</h3>
      ${q.a.map((a,k)=>`<button class="opt" data-k="${k}">${esc(t(a))}</button>`).join("")}<div id="fb"></div>`;
    el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k; if(k===q.correct) score++;
      el.querySelectorAll(".opt").forEach(o=>{o.disabled=true; if(+o.dataset.k===q.correct)o.classList.add("ok"); else if(o===b)o.classList.add("bad");});
      el.querySelector("#fb").innerHTML=`<p class="why">💡 ${esc(t(q.why))}</p><button class="pill on" id="nx">${t(UI.next)}</button>`;
      el.querySelector("#nx").onclick=()=>{i++;draw();};
    });
  };
  draw();
}

function adas(el){
  el.innerHTML=`<svg id="sv" viewBox="0 0 400 300" style="width:100%;max-width:520px;display:block;margin:auto"></svg>
    <label>${t(UI.shift)}<input type="range" id="d" min="-60" max="60" value="0"></label>
    <label>${t(UI.shiftS)}<input type="range" id="s" min="-60" max="60" value="0"></label><p id="eq" class="why"></p>`;
  const sv=el.querySelector("#sv");
  const upd=()=>{
    const d=+el.querySelector("#d").value, s=+el.querySelector("#s").value;
    // AD: P = 250 - 0.8(Y - d); SRAS: P = 50 + 0.8(Y - s)  (współrzędne SVG odwrócone)
    const Y=(200+0.8*(d+s))/1.6, P=250-0.8*(Y-d);
    const line=(x1,y1,x2,y2,c,w=2,da="")=>`<line x1="${x1}" y1="${300-y1}" x2="${x2}" y2="${300-y2}" stroke="${c}" stroke-width="${w}" stroke-dasharray="${da}"/>`;
    const X=v=>40+v*1.4, Yp=v=>v;
    sv.innerHTML=`<defs><clipPath id="cp"><rect x="40" y="10" width="350" height="270"/></clipPath></defs><g clip-path="url(#cp)">`+
      line(X(125),20,X(125),290,"var(--muted)",1.5,"5 4")+
      line(X(d-40),250+0.8*40,X(d+250),250-0.8*250,"var(--accent)",2.5)+
      line(X(s-40),50-0.8*40,X(s+230),50+0.8*230,"#e07b00",2.5)+`</g>`+
      line(40,20,40,290,"var(--muted)",1)+line(40,20,390,20,"var(--muted)",1)+
      `<text x="${X(125)+4}" y="20">LRAS</text>`+`<text x="${X(d+230)}" y="${300-(250-0.8*230)-6}">AD</text>`+
      `<text x="${X(s+215)}" y="${300-(50+0.8*215)-6}">SRAS</text>`+
      `<circle cx="${X(Y)}" cy="${300-P}" r="5" fill="var(--text)"/>`+
      `<text x="380" y="295" text-anchor="end">Y</text><text x="28" y="34">P</text>`;
    el.querySelector("#eq").textContent=`Y* ≈ ${Y.toFixed(0)} · P* ≈ ${(P/1.25).toFixed(0)}`;
  };
  el.querySelectorAll("input").forEach(i=>i.oninput=upd); upd();
}

function exam(){
  const all=C.topics.flatMap(x=>x.quiz).sort(()=>Math.random()-.5).slice(0,10);
  return {html:`<div class="card"><h2>🎯 ${t(UI.exam)}</h2><p class="why">${t(UI.examDesc)}</p></div><div class="card"><div id="quiz"></div></div>`, qs:all};
}

function render(){
  document.documentElement.lang=lang;
  document.getElementById("title").innerHTML=`${esc(t(C.title))} <small>· ${esc(C.university)}</small>`;
  document.getElementById("langBtn").textContent=lang==="pl"?"🇵🇱 PL → RU":"🇷🇺 RU → PL";
  document.querySelector("nav").classList.remove("open");
  nav();
  const [id,tab]=location.hash.slice(2).split("/");
  const main=document.getElementById("main");
  const x=C.topics.find(z=>z.id===id);
  if(id==="exam"){const e=exam();main.innerHTML=e.html;quiz(main.querySelector("#quiz"),e.qs);}
  else if(x){
    main.innerHTML=topic(x,tab);
    main.querySelector("#markBtn").onclick=()=>{done[x.id]=!done[x.id];store.set("done",done);render();};
    const q=main.querySelector("#quiz"); if(q) quiz(q,x.quiz);
    const c=main.querySelector("#cards"); if(c) cards(c,x);
    const ch=main.querySelector("#chart"); if(ch) adas(ch);
  } else main.innerHTML=home();
  window.scrollTo(0,0);
}
applyTheme();
addEventListener("hashchange",render);
render();
</script>
</body>
</html>
