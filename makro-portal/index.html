<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Makroekonomia WSB</title>
<style>
:root{
  --bg:#f2f2f7;--card:#fff;--text:#000;--muted:#8e8e93;--sep:rgba(60,60,67,.18);--fill:rgba(118,118,128,.12);
  --blue:#007aff;--green:#34c759;--red:#ff3b30;--orange:#ff9500;--indigo:#5856d6;--teal:#30b0c7;--pink:#ff2d55;
  --bar:rgba(249,249,249,.85);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000;--card:#1c1c1e;--text:#fff;--muted:#8e8e93;--sep:rgba(84,84,88,.6);--fill:rgba(118,118,128,.24);
  --blue:#0a84ff;--green:#30d158;--red:#ff453a;--orange:#ff9f0a;--indigo:#5e5ce6;--teal:#40c8e0;--pink:#ff375f;--bar:rgba(22,22,24,.85)}}
:root[data-theme="dark"]{
  --bg:#000;--card:#1c1c1e;--text:#fff;--muted:#8e8e93;--sep:rgba(84,84,88,.6);--fill:rgba(118,118,128,.24);
  --blue:#0a84ff;--green:#30d158;--red:#ff453a;--orange:#ff9f0a;--indigo:#5e5ce6;--teal:#40c8e0;--pink:#ff375f;--bar:rgba(22,22,24,.85)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* nav bar */
.navbar{position:sticky;top:0;z-index:10;height:44px;display:flex;align-items:center;justify-content:center;padding:0 16px;
  background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid transparent;transition:border-color .2s}
.navbar.scrolled{border-bottom-color:var(--sep)}
.navbar .t{font-weight:600;font-size:17px;opacity:0;transition:opacity .2s}
.navbar.scrolled .t{opacity:1}
.navbar .back{position:absolute;left:8px;display:flex;align-items:center;color:var(--blue);font-size:17px}
.navbar .back svg{width:24px;height:24px;stroke-width:2.4}

.wrap{max-width:680px;margin:0 auto;padding:0 16px calc(100px + env(safe-area-inset-bottom))}
.large{font-size:34px;font-weight:700;letter-spacing:.37px;margin:4px 0 8px}
.sub{color:var(--muted);font-size:15px;margin:-4px 0 16px}

/* grouped inset list */
.hdr{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:-.08px;margin:24px 16px 7px}
.foot{color:var(--muted);font-size:13px;margin:7px 16px 0}
.group{background:var(--card);border-radius:12px;overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;min-height:44px;padding:10px 16px;position:relative;width:100%;text-align:left}
.cell + .cell::before{content:"";position:absolute;top:0;right:0;left:60px;border-top:.5px solid var(--sep)}
.group.plain .cell + .cell::before{left:16px}
.cell:active{background:var(--fill)}
.cell .body{flex:1;min-width:0}
.cell .body small{display:block;color:var(--muted);font-size:13px;margin-top:1px}
.cell .val{color:var(--muted);font-size:15px}
.chev{color:#c4c4c7;width:14px;height:14px;stroke-width:2.6}
.ico{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.ico svg{width:18px;height:18px;stroke-width:2}
.check{color:var(--green)}

/* widgets */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border-radius:12px;padding:14px 16px}
.tile .n{font-size:28px;font-weight:700;margin-top:6px}
.tile .l{color:var(--muted);font-size:13px}
.ring{display:block}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:12px;background:var(--blue);color:#fff;font-weight:600}
.btn.gray{background:var(--fill);color:var(--blue)}
.btn:disabled{opacity:.4}

/* segmented control */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:8px 0 16px;overflow-x:auto;scrollbar-width:none}
.seg a{flex:1;min-width:max-content;text-align:center;font-size:13px;font-weight:500;padding:6px 10px;border-radius:7px;white-space:nowrap}
.seg a.on{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);font-weight:600}

.note{padding:14px 16px;line-height:1.5}
.note li{margin:6px 0}
.formula{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:16px}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--fill);color:var(--muted)}
.badge.ok{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}

/* flashcards */
.flash{background:var(--card);border-radius:16px;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;cursor:pointer;user-select:none;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.flash .w{font-size:26px;font-weight:600}
.flash .def{font-size:19px;font-weight:500;line-height:1.4}
.flash .s{color:var(--muted);font-size:13px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}

/* quiz */
.qprog{height:4px;background:var(--fill);border-radius:2px;overflow:hidden;margin:4px 0 16px}
.qprog i{display:block;height:100%;background:var(--blue);transition:width .3s}
.q{font-size:20px;font-weight:600;margin:0 0 14px}
.opt{justify-content:space-between}
.opt.ok{color:var(--green);font-weight:600}
.opt.bad{color:var(--red)}
.why{color:var(--muted);font-size:15px;padding:12px 16px}
.result{text-align:center;padding:24px 16px}
.result .big{font-size:48px;font-weight:700}

/* tab bar */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;justify-content:center;background:var(--bar);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom)}
.tabbar a{flex:1;max-width:170px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;font-size:10px;font-weight:500;color:var(--muted)}
.tabbar a.on{color:var(--blue)}
.tabbar svg{width:26px;height:26px}

input[type=range]{width:100%;accent-color:var(--blue)}
.chart text{fill:var(--muted);font-size:12px}
.toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:var(--card);box-shadow:0 8px 30px rgba(0,0,0,.18);border-radius:14px;padding:12px 18px;display:flex;gap:10px;align-items:center;z-index:20;font-weight:600;white-space:nowrap;animation:pop .3s}
@keyframes pop{from{opacity:0;transform:translate(-50%,-10px)}}
</style>
</head>
<body>
<div class="navbar" id="navbar"><span id="back"></span><span class="t" id="navTitle"></span></div>
<div class="wrap" id="main"></div>
<nav class="tabbar" id="tabbar"></nav>
<script src="data.js"></script>
<script>
const C = window.COURSE;

// Ikony w stylu SF Symbols (stroke, 24×24)
const I = {
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/>',
  book:'<path d="M12 6.5C10 5 7 4.5 3.5 5v14c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5Z"/><path d="M12 6.5v14"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>',
  chev:'<path d="m9 5 7 7-7 7"/>',
  back:'<path d="m15 5-7 7 7 7"/>',
  check:'<circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16.5 9.5"/>',
  checkFill:'<circle cx="12" cy="12" r="10" fill="currentColor" stroke="none"/><path d="m7.5 12.5 3 3 6-6.5" stroke="#fff" stroke-width="2.2"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  calendar:'<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3Z"/>',
  moon:'<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M5.5 7l1 12a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>',
  play:'<path d="M7 4.5v15l12-7.5-12-7.5Z"/>',
  x:'<circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/>',
  trophy:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M17 6h3v2a3 3 0 0 1-3 3M7 6H4v2a3 3 0 0 0 3 3"/>',
  chart:'<path d="M4 4v16h16"/><path d="m7 15 4-4 3 3 5-6"/>',
};
const icon = (n, cls="i") => `<svg class="${cls}" viewBox="0 0 24 24">${I[n]}</svg>`;
const LECTURE_COLORS = ["--blue","--indigo","--orange","--teal","--pink","--green","--red"];

const UI = {
  home:{pl:"Start",ru:"Главная"}, lectures:{pl:"Wykłady",ru:"Лекции"}, exam:{pl:"Egzamin",ru:"Экзамен"}, settings:{pl:"Ustawienia",ru:"Настройки"},
  lecture:{pl:"Wykład",ru:"Лекция"}, toExam:{pl:"dni do egzaminu",ru:"дней до экзамена"}, mastered:{pl:"wykładów zaliczonych",ru:"лекций зачтено"},
  continue:{pl:"Kontynuuj",ru:"Продолжить"}, allDone:{pl:"Wszystkie wykłady zaliczone!",ru:"Все лекции зачтены!"},
  summary:{pl:"Notatki",ru:"Конспект"}, formulas:{pl:"Wzory",ru:"Формулы"}, terms:{pl:"Pojęcia",ru:"Термины"},
  cards:{pl:"Fiszki",ru:"Карточки"}, quiz:{pl:"Test",ru:"Тест"}, chart:{pl:"Wykres",ru:"График"},
  term:{pl:"Pojęcie",ru:"Термин"}, meaning:{pl:"Znaczenie",ru:"Значение"},
  flip:{pl:"Dotknij, aby odwrócić",ru:"Нажми, чтобы перевернуть"}, know:{pl:"Umiem",ru:"Знаю"}, again:{pl:"Jeszcze raz",ru:"Ещё раз"},
  next:{pl:"Dalej",ru:"Дальше"}, finish:{pl:"Zakończ",ru:"Завершить"}, retry:{pl:"Spróbuj ponownie",ru:"Пройти снова"},
  passed:{pl:"Zaliczone",ru:"Зачтено"}, notPassed:{pl:"Niezaliczone",ru:"Не зачтено"}, best:{pl:"Najlepszy wynik",ru:"Лучший результат"},
  rule:{pl:"Wykład zostanie zaliczony po rozwiązaniu testu na 100%.",ru:"Лекция зачитывается, когда тест пройден на 100%."},
  perfect:{pl:"Wykład zaliczony!",ru:"Лекция зачтена!"}, need:{pl:"Do zaliczenia potrzebne jest 100%.",ru:"Для зачёта нужно 100%."},
  examDesc:{pl:"Losowe pytania ze wszystkich wykładów. Nie wpływa na zaliczenia.",ru:"Случайные вопросы по всем лекциям. Не влияет на зачёты."},
  startExam:{pl:"Rozpocznij egzamin próbny",ru:"Начать пробный экзамен"}, questions:{pl:"pytań",ru:"вопросов"},
  language:{pl:"Język",ru:"Язык"}, theme:{pl:"Motyw",ru:"Тема"}, auto:{pl:"Automatyczny",ru:"Авто"}, light:{pl:"Jasny",ru:"Светлая"}, dark:{pl:"Ciemny",ru:"Тёмная"},
  reset:{pl:"Resetuj postęp",ru:"Сбросить прогресс"}, resetQ:{pl:"Na pewno usunąć cały postęp?",ru:"Точно удалить весь прогресс?"},
  examDate:{pl:"Data egzaminu",ru:"Дата экзамена"},
  shiftD:{pl:"Przesunięcie AD (np. wzrost G)",ru:"Сдвиг AD (например, рост G)"}, shiftS:{pl:"Przesunięcie SAS (np. szok podażowy)",ru:"Сдвиг SAS (например, шок предложения)"},
  ch_adas:{pl:"Model AD–AS",ru:"Модель AD–AS"}, ch_inflation:{pl:"Inflacja w Polsce 2003–2024 (%)",ru:"Инфляция в Польше 2003–2024 (%)"},
  target:{pl:"cel NBP 2,5% ± 1",ru:"цель NBP 2,5% ± 1"}, program:{pl:"Program kursu",ru:"Программа курса"}, soon:{pl:"wkrótce",ru:"скоро"},
};

const store = {
  get(k,d){try{return JSON.parse(localStorage.getItem("makro."+k))??d}catch{return d}},
  set(k,v){try{localStorage.setItem("makro."+k,JSON.stringify(v))}catch{}},
};
let lang = store.get("lang","pl");
let best = store.get("best",{});          // { [id]: najlepszy wynik 0..1 }
const passed = id => best[id] === 1;       // zaliczenie = 100% w teście wykładu
const t = o => o==null ? "" : typeof o==="string" ? o : (o[lang] ?? o.pl);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lectures = [...C.topics].sort((a,b)=>a.lecture-b.lecture);
const colorOf = x => `var(${LECTURE_COLORS[(x.lecture-1)%LECTURE_COLORS.length]})`;

function applyTheme(){
  const th = store.get("theme","auto");
  if (th==="auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = th;
}
function toast(html){
  const d=document.createElement("div"); d.className="toast"; d.innerHTML=html; document.body.appendChild(d);
  setTimeout(()=>d.remove(),2200);
}

// ---------- widoki ----------
function ring(p){
  const r=26,c=2*Math.PI*r;
  return `<svg class="ring" width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--fill)" stroke-width="7"/>
    <circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--green)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" transform="rotate(-90 32 32)"/></svg>`;
}
function lectureCell(x){
  const ok=passed(x.id);
  return `<a class="cell" href="#/l/${x.id}">
    <span class="ico" style="background:${colorOf(x)}">${icon("book")}</span>
    <span class="body">${esc(t(x.title))}<small>${t(UI.lecture)} ${x.lecture}${best[x.id]!=null&&!ok?` · ${Math.round(best[x.id]*100)}%`:""}</small></span>
    ${ok?`<span class="check">${icon("checkFill")}</span>`:""}${icon("chev","i chev")}</a>`;
}
function vHome(){
  const n=lectures.length, d=lectures.filter(x=>passed(x.id)).length;
  const days=Math.max(0,Math.ceil((new Date(C.examDate)-new Date())/864e5));
  const nx=lectures.find(x=>!passed(x.id));
  return {title:t(C.title), html:`
    <h1 class="large">${esc(t(C.title))}</h1><p class="sub">${esc(C.university)}</p>
    <div class="tiles">
      <div class="tile" style="display:flex;align-items:center;gap:12px">${ring(n?d/n:0)}<div><div class="n" style="margin:0">${d}/${n}</div><div class="l">${t(UI.mastered)}</div></div></div>
      <div class="tile"><span style="color:var(--orange)">${icon("calendar")}</span><div class="n">${days}</div><div class="l">${t(UI.toExam)}</div></div>
    </div>
    <div class="hdr">${t(UI.continue)}</div>
    <div class="group">${nx?lectureCell(nx):`<div class="cell"><span class="ico" style="background:var(--green)">${icon("trophy")}</span><span class="body">${t(UI.allDone)}</span></div>`}</div>
    <p class="foot">${t(UI.rule)}</p>
`};
}
function vLectures(){
  const have=new Set(lectures.map(x=>x.lecture));
  const rest=(C.program||[]).filter(p=>!have.has(p.n));
  return {title:t(UI.lectures), html:`<h1 class="large">${t(UI.lectures)}</h1>
    <div class="group">${lectures.map(lectureCell).join("")}</div><p class="foot">${t(UI.rule)}</p>
    ${rest.length?`<div class="hdr">${t(UI.program)}</div><div class="group">${rest.map(p=>`<div class="cell" style="opacity:.55">
      <span class="ico" style="background:var(--muted)">${icon("lock")}</span><span class="body">${esc(t(p))}<small>${t(UI.lecture)} ${p.n} · ${t(UI.soon)}</small></span></div>`).join("")}</div>`:""}`};
}
function vLecture(x, tab){
  const tabs=["summary","formulas","terms","cards","quiz"]; if(x.charts?.length) tabs.splice(1,0,"chart");
  if(!tabs.includes(tab)) tab="summary";
  const ok=passed(x.id);
  let body="";
  if(tab==="summary") body=x.summary.map(s=>`<div class="hdr">${esc(t(s.h))}</div><div class="group"><ul class="note">${(s.pts[lang]||s.pts.pl).map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>`).join("");
  if(tab==="formulas") body=`<div class="group plain">${x.formulas.map(f=>`<div class="cell"><span class="body"><span class="formula">${esc(f.f)}</span><small>${esc(t(f.d))}</small></span></div>`).join("")}</div>`;
  if(tab==="terms") body=`<div class="group plain">${x.terms.map(r=>`<div class="cell"><span class="body"><b>${esc(lang==="pl"?r.pl:r.ru)}</b><small>${r.def?esc(t(r.def)):""}</small><small>${esc(lang==="pl"?r.ru:r.pl)}${r.en?` · ${esc(r.en)}`:""}</small></span></div>`).join("")}</div>`;
  if(tab==="chart") body=x.charts.map(c=>`<div class="hdr">${t(UI["ch_"+c])}</div><div class="group" style="padding:16px" data-chart="${c}"></div>`).join("");
  if(tab==="cards") body=`<div id="cards"></div>`;
  if(tab==="quiz") body=`<div id="quiz"></div>`;
  return {title:t(x.title), back:["#/lectures",t(UI.lectures)], html:`
    <p class="sub" style="margin:8px 0 0">${t(UI.lecture)} ${x.lecture}</p>
    <h1 class="large" style="font-size:28px">${esc(t(x.title))}</h1>
    <span class="badge ${ok?"ok":""}">${ok?t(UI.passed):t(UI.notPassed)}${best[x.id]!=null?` · ${t(UI.best)}: ${Math.round(best[x.id]*100)}%`:""}</span>
    <div class="seg">${tabs.map(k=>`<a class="${k===tab?"on":""}" href="#/l/${x.id}/${k}">${t(UI[k])}</a>`).join("")}</div>
    ${body}`};
}
function vExam(){
  const total=C.topics.reduce((s,x)=>s+x.quiz.length,0);
  return {title:t(UI.exam), html:`<h1 class="large">${t(UI.exam)}</h1>
    <div id="quiz"><div class="group"><div class="cell"><span class="ico" style="background:var(--red)">${icon("target")}</span>
      <span class="body">${t(UI.examDesc)}<small>${Math.min(15,total)} ${t(UI.questions)}</small></span></div></div>
      <div style="margin-top:16px"><button class="btn" id="go">${icon("play")} ${t(UI.startExam)}</button></div></div>`};
}
function vSettings(){
  const th=store.get("theme","auto");
  const opt=(cur,val,label,key)=>`<button class="cell" data-${key}="${val}"><span class="body">${label}</span>${cur===val?`<span style="color:var(--blue)">${icon("checkFill")}</span>`:""}</button>`;
  return {title:t(UI.settings), html:`<h1 class="large">${t(UI.settings)}</h1>
    <div class="hdr">${t(UI.language)}</div>
    <div class="group plain">${opt(lang,"pl","Polski","lang")}${opt(lang,"ru","Русский","lang")}</div>
    <div class="hdr">${t(UI.theme)}</div>
    <div class="group plain">${opt(th,"auto",t(UI.auto),"theme")}${opt(th,"light",t(UI.light),"theme")}${opt(th,"dark",t(UI.dark),"theme")}</div>
    <div class="hdr">&nbsp;</div>
    <div class="group plain"><div class="cell"><span class="body">${t(UI.examDate)}</span><span class="val">${new Date(C.examDate).toLocaleDateString(lang)}</span></div></div>
    <div class="hdr">&nbsp;</div>
    <div class="group plain"><button class="cell" id="reset" style="color:var(--red);justify-content:center">${t(UI.reset)}</button></div>`};
}

// ---------- interakcje ----------
function cards(el, x){
  let deck=x.terms.map((_,i)=>i), i=0, flipped=false;
  const draw=()=>{
    if(!deck.length){el.innerHTML=`<div class="group result"><span class="check">${icon("checkFill")}</span><p>${x.terms.length}/${x.terms.length}</p></div>
      <div style="margin-top:12px"><button class="btn gray" id="re">${t(UI.retry)}</button></div>`;el.querySelector("#re").onclick=()=>cards(el,x);return;}
    const r=x.terms[deck[i%deck.length]];
    const front=lang==="pl"?r.pl:r.ru, back=r.def?t(r.def):(lang==="pl"?r.ru:r.pl);
    el.innerHTML=`<div class="flash" id="fc"><span class="s">${t(flipped?UI.meaning:UI.term)} · ${deck.length}</span>
      <div class="w${flipped?" def":""}" style="margin:16px 0">${esc(flipped?back:front)}</div>${flipped?`<span class="s" style="margin-bottom:8px">${esc(lang==="pl"?r.ru:r.pl)}</span>`:""}<span class="s">${t(UI.flip)}</span></div>
      <div class="row2"><button class="btn gray" id="ag">${t(UI.again)}</button><button class="btn" id="kn">${t(UI.know)}</button></div>`;
    el.querySelector("#fc").onclick=()=>{flipped=!flipped;draw();};
    el.querySelector("#ag").onclick=()=>{i++;flipped=false;draw();};
    el.querySelector("#kn").onclick=()=>{deck.splice(i%deck.length,1);flipped=false;draw();};
  };
  draw();
}

// onFinish(score, total) — wywoływane po ostatnim pytaniu
function quiz(el, qs, onFinish){
  let i=0, score=0;
  const draw=()=>{
    if(i>=qs.length){
      const msg=onFinish?.(score,qs.length)||"";
      const pct=Math.round(score/qs.length*100);
      el.innerHTML=`<div class="group result"><span style="color:${pct===100?"var(--green)":"var(--orange)"}">${icon(pct===100?"trophy":"target")}</span>
        <div class="big">${pct}%</div><div class="sub" style="margin:0">${score}/${qs.length}</div>${msg?`<p>${msg}</p>`:""}</div>
        <div style="margin-top:16px"><button class="btn ${pct===100?"gray":""}" id="re">${t(UI.retry)}</button></div>`;
      el.querySelector("#re").onclick=()=>quiz(el,qs,onFinish);return;
    }
    const q=qs[i];
    el.innerHTML=`<div class="qprog"><i style="width:${i/qs.length*100}%"></i></div>
      <p class="sub" style="margin:0 0 6px">${i+1} / ${qs.length}</p><p class="q">${esc(t(q.q))}</p>
      <div class="group plain">${q.a.map((a,k)=>`<button class="cell opt" data-k="${k}"><span class="body">${esc(t(a))}</span><span class="mark"></span></button>`).join("")}</div>
      <div id="fb"></div>`;
    el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k; if(k===q.correct) score++;
      el.querySelectorAll(".opt").forEach(o=>{o.disabled=true;
        if(+o.dataset.k===q.correct){o.classList.add("ok");o.querySelector(".mark").innerHTML=icon("checkFill");}
        else if(o===b){o.classList.add("bad");o.querySelector(".mark").innerHTML=icon("x");}});
      el.querySelector("#fb").innerHTML=`<p class="why">${esc(t(q.why))}</p><button class="btn" id="nx">${t(i+1<qs.length?UI.next:UI.finish)}</button>`;
      el.querySelector("#nx").onclick=()=>{i++;draw();};
    });
  };
  draw();
}

function adas(el){
  el.innerHTML=`<svg class="chart" viewBox="0 0 400 300" style="width:100%;display:block"></svg>
    <p style="font-size:15px;margin:16px 0 4px">${t(UI.shiftD)}</p><input type="range" id="d" min="-60" max="60" value="0">
    <p style="font-size:15px;margin:12px 0 4px">${t(UI.shiftS)}</p><input type="range" id="s" min="-60" max="60" value="0"><p id="eq" class="sub" style="margin:12px 0 0"></p>`;
  const sv=el.querySelector("svg");
  const upd=()=>{
    const d=+el.querySelector("#d").value, s=+el.querySelector("#s").value;
    // AD: P = 250 - 0.8(Y - d); SRAS: P = 50 + 0.8(Y - s)
    const Y=(200+0.8*(d+s))/1.6, P=250-0.8*(Y-d), X=v=>40+v*1.4;
    const line=(x1,y1,x2,y2,c,w=2,da="")=>`<line x1="${x1}" y1="${300-y1}" x2="${x2}" y2="${300-y2}" stroke="${c}" stroke-width="${w}" stroke-dasharray="${da}" stroke-linecap="round"/>`;
    sv.innerHTML=`<defs><clipPath id="cp"><rect x="40" y="10" width="350" height="270"/></clipPath></defs><g clip-path="url(#cp)">`+
      line(X(125),20,X(125),290,"var(--muted)",1.5,"5 4")+
      line(X(d-40),250+32,X(d+250),250-200,"var(--blue)",3)+
      line(X(s-40),50-32,X(s+230),50+184,"var(--orange)",3)+`</g>`+
      line(40,20,40,290,"var(--muted)",1)+line(40,20,390,20,"var(--muted)",1)+
      `<text x="${X(125)+4}" y="20">LAS</text><text x="${X(d+230)}" y="${300-(250-0.8*230)-8}">AD</text><text x="${X(s+215)}" y="${300-(50+0.8*215)-8}">SAS</text>`+
      `<circle cx="${X(Y)}" cy="${300-P}" r="6" fill="var(--card)" stroke="var(--text)" stroke-width="2.5"/>`+
      `<text x="380" y="295" text-anchor="end">Y</text><text x="28" y="34">P</text>`;
    el.querySelector("#eq").textContent=`Y* ≈ ${Y.toFixed(0)} · P* ≈ ${(P/1.25).toFixed(0)}`;
  };
  el.querySelectorAll("input").forEach(i=>i.oninput=upd); upd();
}

function inflation(el){
  const d=C.data.inflation, W=400, H=230, L=30, B=200, top=14, max=15, min=-2;
  const y=v=>B-(v-min)/(max-min)*(B-top), bw=(W-L-6)/d.length;
  let s=`<rect x="${L}" y="${y(3.5)}" width="${W-L}" height="${y(1.5)-y(3.5)}" fill="var(--green)" opacity=".15"/>`;
  [0,5,10,15].forEach(v=>s+=`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--sep)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`);
  d.forEach(([yr,v],i)=>{const x=L+4+i*bw, c=v<0?"var(--teal)":v>3.5?"var(--red)":"var(--blue)";
    s+=`<rect x="${x}" y="${Math.min(y(v),y(0))}" width="${bw-3}" height="${Math.max(1,Math.abs(y(v)-y(0)))}" rx="2" fill="${c}"><title>${yr}: ${String(v).replace(".",",")}%</title></rect>`;
    if(yr%3===0||yr===2022) s+=`<text x="${x+bw/2-1}" y="${H-12}" text-anchor="middle">${String(yr).slice(2)}</text>`;
    if(yr===2022) s+=`<text x="${x+bw/2-1}" y="${y(v)-4}" text-anchor="middle" style="fill:var(--text);font-weight:600">14,4</text>`;});
  el.innerHTML=`<svg class="chart" viewBox="0 0 ${W} ${H}" style="width:100%;display:block">${s}</svg>
    <p class="sub" style="margin:8px 0 0"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--green);opacity:.4"></span> ${t(UI.target)} · GUS</p>`;
}

// ---------- router ----------
function render(){
  document.documentElement.lang=lang;
  const [route,id,tab]=location.hash.slice(2).split("/");
  const x = route==="l" && C.topics.find(z=>z.id===id);
  const view = x ? vLecture(x,tab) : route==="lectures" ? vLectures() : route==="exam" ? vExam() : route==="settings" ? vSettings() : vHome();
  const main=document.getElementById("main");
  main.innerHTML=view.html;
  document.getElementById("navTitle").textContent=view.title;
  document.getElementById("back").innerHTML=view.back?`<a class="back" href="${view.back[0]}">${icon("back")}${esc(view.back[1])}</a>`:"";
  const active = x ? "lectures" : (route||"home");
  document.getElementById("tabbar").innerHTML=[["home","home","#/"],["lectures","book","#/lectures"],["exam","target","#/exam"],["settings","gear","#/settings"]]
    .map(([k,ic,h])=>`<a href="${h}" class="${active===k?"on":""}">${icon(ic)}${t(UI[k])}</a>`).join("");

  if(x){
    const q=main.querySelector("#quiz");
    if(q) quiz(q,x.quiz,(score,total)=>{
      const r=score/total, was=passed(x.id);
      if(best[x.id]==null||r>best[x.id]){best[x.id]=r;store.set("best",best);}
      if(r===1&&!was){toast(`<span class="check">${icon("checkFill")}</span>${t(UI.perfect)}`);}
      main.querySelector(".badge").outerHTML=`<span class="badge ${passed(x.id)?"ok":""}">${passed(x.id)?t(UI.passed):t(UI.notPassed)} · ${t(UI.best)}: ${Math.round(best[x.id]*100)}%</span>`;
      return r===1?t(UI.perfect):t(UI.need);
    });
    const c=main.querySelector("#cards"); if(c) cards(c,x);
    main.querySelectorAll("[data-chart]").forEach(el=>({adas,inflation})[el.dataset.chart]?.(el));
  }
  if(route==="exam") main.querySelector("#go").onclick=()=>{
    const qs=C.topics.flatMap(z=>z.quiz).sort(()=>Math.random()-.5).slice(0,15);
    quiz(main.querySelector("#quiz"),qs);
  };
  if(route==="settings"){
    main.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;store.set("lang",lang);render();});
    main.querySelectorAll("[data-theme]").forEach(b=>b.onclick=()=>{store.set("theme",b.dataset.theme);applyTheme();render();});
    main.querySelector("#reset").onclick=()=>{if(confirm(t(UI.resetQ))){best={};store.set("best",best);render();}};
  }
  window.scrollTo(0,0); onScroll();
}
function onScroll(){document.getElementById("navbar").classList.toggle("scrolled",scrollY>40);}
addEventListener("scroll",onScroll,{passive:true});
addEventListener("hashchange",render);
applyTheme();
render();
</script>
